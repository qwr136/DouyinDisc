name: Build DouyinDisc TrollFools dylib

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: trollfools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TOOLCHAIN_ROOT: /tmp/xiaofei-toolchain
  THEOS: /tmp/xiaofei-toolchain/theos

  THEOS_COMMIT: cfba89a53a05b4a1b822121158acc3669c20602f
  SDK_COMMIT: 0222fd5413cf4b9af096f37b4621afa2688572f7
  SDK_VERSION: '16.5'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          check-latest: false
      - name: Validate source and lock
        run: |
          python3 scripts/toolchain.py static
          python3 tests/run_tests.py -v
      - name: Upload source test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trollfools-source-test-report-${{ github.run_attempt }}
          path: tests/report.txt
          if-no-files-found: warn

  build:
    needs: test
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          check-latest: false
      - name: Select policy-compatible Xcode
        id: toolchain_host
        run: python3 scripts/toolchain.py select-xcode --github-env
      - name: Cache pinned sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}
          key: toolchain-trollfools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain_host.outputs.cache_key }}-${{ hashFiles('toolchain-lock.json') }}
      - name: Prepare only pinned sources and SDK
        run: python3 scripts/toolchain.py prepare
      - name: Verify actual host and SDK
        run: python3 scripts/toolchain.py verify --output reports/toolchain-verification.json
      - name: Compile and sign
        run: ./build.sh
      - name: Real UIKit display regression
        run: python3 scripts/run_uikit_tests.py
      - name: Verify dylib and save receipt
        run: |
          python3 tests/verify_dylib.py --project . --verify-artwork artifacts/DouyinDisc.dylib > reports/dylib-validation.json
          python3 scripts/toolchain.py receipt --output reports/build-receipt.json
      - name: Upload verified dylib and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trollfools-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/DouyinDisc.dylib
            reports/build-receipt.json
            reports/dylib-validation.json
            reports/toolchain-verification.json
            reports/uikit-report.txt
            reports/settings-layout.png
            reports/numeric-keyboard-panel.png
            reports/numeric-keyboard-screen.png
            reports/numeric-keyboard-visible.json
            tests/report.txt
            toolchain-lock.json
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn

